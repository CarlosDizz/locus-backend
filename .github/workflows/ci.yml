name: CI

on:
  push:
    branches: [main, backend-v2]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - run: ruff check src tests
      - run: pytest
      - run: python -m compileall -q src
      - name: Validate production Compose
        env:
          LOCUS_ENV_FILE: .env.production.example
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config -q

  control-panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-panel/package-lock.json
      - run: npm ci
      - run: npm run build
