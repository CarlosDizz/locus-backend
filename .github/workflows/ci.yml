name: CI

on:
  push:
    branches: [main, backend-v2]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - run: ruff check src tests
      - run: pytest
      - run: python -m compileall -q src
      - name: Validate production Compose
        env:
          LOCUS_ENV_FILE: .env.production.example
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config -q

  control-panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-panel/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy-production:
    name: Deploy V2 to EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, control-panel]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: locus-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/locus-production
          chmod 600 ~/.ssh/locus-production
          cp .github/production-known_hosts ~/.ssh/known_hosts

      - name: Synchronize release
        env:
          DEPLOY_HOST: 15.217.177.95
          DEPLOY_USER: ec2-user
        run: |
          rsync -az --delete-delay \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.env.local.seed' \
            --exclude '.env.production' \
            --exclude 'backups/' \
            --exclude 'control-panel/node_modules/' \
            --exclude 'control-panel/dist/' \
            -e 'ssh -i ~/.ssh/locus-production -o StrictHostKeyChecking=yes' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/home/ec2-user/locus-backend-v2/"

      - name: Back up, build and deploy
        env:
          DEPLOY_HOST: 15.217.177.95
          DEPLOY_USER: ec2-user
        run: |
          ssh -i ~/.ssh/locus-production -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" '
            set -euo pipefail
            cd /home/ec2-user/locus-backend-v2
            ./bin/production backup-v2
            ./bin/production build
            ./bin/production up
            ./bin/production smoke
          '
