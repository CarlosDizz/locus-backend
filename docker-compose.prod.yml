services:
  api:
    build: .
    restart: unless-stopped
    env_file: ${LOCUS_ENV_FILE:-.env.production}
    command: >
      sh -c "alembic upgrade head &&
      python -m locus_v2.entrypoints.seed &&
      uvicorn locus_v2.entrypoints.api:app --host 0.0.0.0 --port 8100"
    expose:
      - "8100"
    depends_on:
      mysql:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/v2/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  realtime:
    build: .
    restart: unless-stopped
    env_file: ${LOCUS_ENV_FILE:-.env.production}
    command: uvicorn locus_v2.entrypoints.realtime:app --host 0.0.0.0 --port 8101
    expose:
      - "8101"
    depends_on:
      mysql:
        condition: service_healthy
      valkey:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    env_file: ${LOCUS_ENV_FILE:-.env.production}
    command: python -m locus_v2.entrypoints.worker
    depends_on:
      api:
        condition: service_healthy
      valkey:
        condition: service_healthy

  control-panel:
    build: ./control-panel
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      control-panel:
        condition: service_started

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-locus}
      MYSQL_USER: ${DB_USER:-locus}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Off on purpose: performance_schema reserves several hundred MB for
      # instrumentation nobody reads here, on a 1 GB t3.micro where mysqld had
      # 503 MB paged out to swap (measured 2026-09-08). Turn it back on only
      # while actually diagnosing a query problem. The live database still runs
      # from the older locus-backend/ compose file; this keeps the two
      # definitions from disagreeing if mysql is ever recreated from this one.
      - --performance-schema=OFF
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --save 60 1 --maxmemory 96mb --maxmemory-policy allkeys-lru
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
  valkey_data:
  caddy_data:
  caddy_config:
