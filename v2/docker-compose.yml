services:
  control-panel:
    build: ./control-panel
    ports:
      - "4201:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build: .
    env_file: ${LOCUS_ENV_FILE:-.env.local}
    command: sh -c "alembic upgrade head && python -m locus_v2.entrypoints.seed && uvicorn locus_v2.entrypoints.api:app --host 0.0.0.0 --port 8100 --reload"
    ports:
      - "8100:8100"
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
    depends_on:
      mysql:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/v2/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 20

  realtime:
    build: .
    env_file: ${LOCUS_ENV_FILE:-.env.local}
    command: uvicorn locus_v2.entrypoints.realtime:app --host 0.0.0.0 --port 8101 --reload
    ports:
      - "8101:8101"
    volumes:
      - ./src:/app/src
    depends_on:
      mysql:
        condition: service_healthy
      valkey:
        condition: service_healthy

  worker:
    build: .
    env_file: ${LOCUS_ENV_FILE:-.env.local}
    command: python -m locus_v2.entrypoints.worker
    volumes:
      - ./src:/app/src
    depends_on:
      api:
        condition: service_healthy
      valkey:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root-only
      MYSQL_DATABASE: locus_v2
      MYSQL_USER: locus_v2
      MYSQL_PASSWORD: locus_v2
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - locus_v2_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -plocal-root-only"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6380:6379"
    volumes:
      - locus_v2_valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  locus_v2_mysql:
  locus_v2_valkey:
